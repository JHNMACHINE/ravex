[build-system]
# maturin, since GPU-105: the reshard planner is Rust and the wheel has a
# compiled extension in it. The cost is stated plainly because it is the whole
# trade of that issue — a Ravex wheel is now platform-specific, where a pure
# Python one installed anywhere, and building from source needs a Rust
# toolchain rather than only a C compiler that is never invoked.
requires = ["maturin>=1.5,<2.0"]
build-backend = "maturin"

[project]
name = "ravex"
# Read from Cargo.toml, which is where maturin looks and the only place it will
# look: there is no equivalent of setuptools' `dynamic = {attr = ...}` reading a
# Python attribute. `ravex/__init__.py` still carries the literal because
# `ravex status` reports it and importing the package to print a version is what
# the CLI is trying to avoid; `tests/test_version_is_single.py` fails if the two
# ever disagree.
dynamic = ["version"]
description = "Transparent checkpoint and resume for PyTorch training, with no changes to your training code"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "JHNMACHINE" }]
keywords = ["pytorch", "checkpoint", "training", "resume", "mlops", "preemption"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# torch is deliberately not a dependency: Ravex attaches to whatever build
# of torch the user already has (CUDA, ROCm, CPU) and must never pull a
# different one in.
dependencies = ["PyYAML>=5.1"]

[project.optional-dependencies]
# 0.0.8, and the floor has moved three times for the same reason: each time, the
# version below it loses or wedges something Ravex's own defaults walk straight
# into.
#
#   >=0.0.4  `keep_last` stopped erasing the whole checkpoint history instead
#            of trimming it. (The old `>=0.2` was not satisfiable by any
#            version that has ever existed.)
#   >=0.0.7  two things. `save` could deadlock the interpreter — it blocked on
#            a Moonclip rayon worker waiting for work only that worker could
#            finish, which wedged roughly one run in three. And a merge could
#            unlink a snapshot a reader was still inside. Ravex is the caller
#            that makes both likely: `sharded_checkpoints: per_rank` has every
#            rank on the node saving at once, and the merger runs against
#            stores that a resume may be reading.
#   >=0.0.8  the remote stopped being one-way. `restore_from_remote` exists
#            from 0.0.8, and `_backends.py` catches the `AttributeError` an
#            older engine raises — so on 0.0.7 a rank with an empty disk does
#            not crash, it silently starts from scratch and takes every other
#            rank back with it. That is the failure this floor exists to
#            prevent, and a version pin is the only place it can be caught,
#            since the code path cannot tell "no remote copy" from "no such
#            method". The same release also made a write over 5 GiB reach S3
#            at all, which `sharded_checkpoints: gather` produces on its own
#            for a model of any size.
moonclip = ["moonclip>=0.0.9"]
dev = ["pytest>=7", "numpy"]

[project.urls]
Homepage = "https://codeberg.org/JHNMACHINE/ravex"
Source = "https://codeberg.org/JHNMACHINE/ravex"
Issues = "https://codeberg.org/JHNMACHINE/ravex/issues"
# Shown by PyPI under "Project links", which is where someone deciding whether to
# upgrade looks. A relative link in the README would not serve: PyPI renders
# relative paths as-is instead of resolving them against the repository.
Changelog = "https://codeberg.org/JHNMACHINE/ravex/src/branch/main/CHANGELOG.md"

[project.scripts]
ravex = "ravex._cli:main"

[tool.maturin]
# `ravex/` at the repository root is the Python half of a mixed project;
# maturin finds it from `module-name` and puts the compiled `_core` inside it.
# Subpackages no longer have to be listed the way setuptools needed — what is
# under `ravex/` ships, and `tests`, `bench` and `integration` are outside it.
module-name = "ravex._core"
features = ["extension-module"]

# CHANGELOG.md is sdist-only and was MANIFEST.in's job until maturin took over
# the sdist: the source archive is what a distribution packager or an auditor
# reads, and it was the one place the release notes were missing.
#
# `ravex_autoload.pth` was here too until GPU-108, with a long comment about
# `data_files` installing it one directory above site-packages where Python
# never runs it. The file is gone, so the trap is not worth documenting at a
# place that no longer walks past it — the reasoning is in the changelog, where
# someone wondering why the autoloader disappeared will actually look.
include = [{ path = "CHANGELOG.md", format = "sdist" }]

# maturin copies whatever sits under the Python source directory. Every
# Moonclip 0.0.4 wheel shipped a `__pycache__/` full of cp314 `.pyc` files for
# exactly this reason — built from a tree where the tests had already run.
# `build/` and `dist/` are the second half of that: they are gitignored, but
# maturin globs the working tree rather than asking git, so a leftover
# `build/lib/ravex/` from the setuptools era shipped a *second*, stale copy of
# every module inside the source distribution.
exclude = [
    "**/__pycache__/**",
    "**/*.py[cod]",
    "build/**",
    "dist/**",
    "target/**",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
