[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ravex"
# Read from ravex/__init__.py; see [tool.setuptools.dynamic] below.
dynamic = ["version"]
description = "Transparent checkpoint and resume for PyTorch training, with no changes to your training code"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [{ name = "JHNMACHINE" }]
keywords = ["pytorch", "checkpoint", "training", "resume", "mlops", "preemption"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# torch is deliberately not a dependency: Ravex attaches to whatever build
# of torch the user already has (CUDA, ROCm, CPU) and must never pull a
# different one in.
dependencies = ["PyYAML>=5.1"]

[project.optional-dependencies]
# 0.0.7, and the floor has moved twice for the same reason: each time, the
# version below it loses or wedges something Ravex's own defaults walk straight
# into.
#
#   >=0.0.4  `keep_last` stopped erasing the whole checkpoint history instead
#            of trimming it. (The old `>=0.2` was not satisfiable by any
#            version that has ever existed.)
#   >=0.0.7  two things. `save` could deadlock the interpreter — it blocked on
#            a Moonclip rayon worker waiting for work only that worker could
#            finish, which wedged roughly one run in three. And a merge could
#            unlink a snapshot a reader was still inside. Ravex is the caller
#            that makes both likely: `sharded_checkpoints: per_rank` has every
#            rank on the node saving at once, and the merger runs against
#            stores that a resume may be reading.
moonclip = ["moonclip>=0.0.7"]
dev = ["pytest>=7", "numpy"]

[project.urls]
Homepage = "https://codeberg.org/JHNMACHINE/ravex"
Source = "https://codeberg.org/JHNMACHINE/ravex"
Issues = "https://codeberg.org/JHNMACHINE/ravex/issues"
# Shown by PyPI under "Project links", which is where someone deciding whether to
# upgrade looks. A relative link in the README would not serve: PyPI renders
# relative paths as-is instead of resolving them against the repository.
Changelog = "https://codeberg.org/JHNMACHINE/ravex/src/branch/main/CHANGELOG.md"

[project.scripts]
ravex = "ravex._cli:main"

[tool.setuptools]
packages = ["ravex"]

[tool.setuptools.dynamic]
version = { attr = "ravex.__version__" }

[tool.setuptools.package-data]
ravex = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
