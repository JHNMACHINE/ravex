[build-system]
# hatchling, since GPU-267: Ravex is Python only again, so one `py3-none-any`
# wheel installs anywhere and building from source needs no compiler. From
# GPU-105 to 0.7.8 it was maturin, for a reshard planner and a store transport
# in Rust.
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "ravex"
# Read from `ravex/__init__.py` (`[tool.hatch.version]` below), the one place
# the number is written: `ravex --version` prints the same literal, and a
# release commit bumps it there and nowhere else.
dynamic = ["version"]
description = "Transparent checkpoint and resume for PyTorch training, with no changes to your training code"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "JHNMACHINE" }]
keywords = ["pytorch", "checkpoint", "training", "resume", "mlops", "preemption"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    # Beta, not Stable: the test suite passes on 3.14t (GPU-189), and Ravex
    # is pure Python since GPU-267, but its threads have only been run
    # without the GIL by that suite.
    "Programming Language :: Python :: Free Threading :: 2 - Beta",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# torch is deliberately not a dependency: Ravex attaches to whatever build
# of torch the user already has (CUDA, ROCm, CPU) and must never pull a
# different one in.
dependencies = ["PyYAML>=5.1"]

[project.optional-dependencies]
# 0.0.8, and the floor has moved three times for the same reason: each time, the
# version below it loses or wedges something Ravex's own defaults walk straight
# into.
#
#   >=0.0.4  `keep_last` stopped erasing the whole checkpoint history instead
#            of trimming it. (The old `>=0.2` was not satisfiable by any
#            version that has ever existed.)
#   >=0.0.7  two things. `save` could deadlock the interpreter — it blocked on
#            a Moonclip rayon worker waiting for work only that worker could
#            finish, which wedged roughly one run in three. And a merge could
#            unlink a snapshot a reader was still inside. Ravex is the caller
#            that makes both likely: `sharded_checkpoints: per_rank` has every
#            rank on the node saving at once, and the merger runs against
#            stores that a resume may be reading.
#   >=0.0.8  the remote stopped being one-way. `restore_from_remote` exists
#            from 0.0.8, and `_backends.py` catches the `AttributeError` an
#            older engine raises — so on 0.0.7 a rank with an empty disk does
#            not crash, it silently starts from scratch and takes every other
#            rank back with it. That is the failure this floor exists to
#            prevent, and a version pin is the only place it can be caught,
#            since the code path cannot tell "no remote copy" from "no such
#            method". The same release also made a write over 5 GiB reach S3
#            at all, which `sharded_checkpoints: gather` produces on its own
#            for a model of any size.
#   >=0.1.0  `describe()`, and this move is the round exchange rather than the
#            checkpoint. `_dist/report.py` checks a peer's report — its names,
#            shapes and dtypes — off the manifest before materialising a single
#            tensor, and it calls `describe()` unguarded because there is no
#            sensible fallback for "look at the payload before allocating it".
#            On 0.0.9 that is an AttributeError inside the `except Exception`
#            that treats a peer as unreadable: every round then closes with
#            zero contributors, each node trains its own model, and the log
#            says the round closed. `_backends.py` uses the same release's
#            `load_tensors` and `describe_state_dict` and *can* do without
#            them, so it asks `hasattr`; the exchange cannot, so the floor is
#            where it has to be caught.
#            0.1.1 since GPU-93 and GPU-128: `describe()` carries `hash_raw`,
#            which the audit trail fingerprints a Moonclip checkpoint by, and
#            on Windows a reader holding the manifest open no longer costs the
#            checkpoint being written.
#            0.1.2 since GPU-141 and GPU-152: retention under `keep_last: 1`
#            keeps the newest snapshot instead of the first, and
#            `sync_prefix` is what carries the metrics to the bucket while a
#            run goes on. Without it the metrics stay local, which `_runtime`
#            says, but `keep_last: 1` silently resuming from the first
#            checkpoint is not something to leave reachable.
#            0.1.3 since GPU-154 and GPU-149: a fork pins its parent's step,
#            and the pin has to hold while the parent keeps training in
#            another process. Older releases have no `pin()`, which
#            `_backends` survives by answering False, but then retention can
#            take the fork's only way back.
#            0.1.4 since GPU-159: `restore_from_remote` padded the files it
#            brought down to a 4 KiB page with zeros, so `run.json`,
#            `status.json` and the metrics a fork or a resume reads from a
#            bucket stopped parsing. A fork on a machine that never held its
#            parent lost the parent's id.
#            0.1.5 since GPU-209: with a delta per step, retention deletes
#            while the sync walks the store, and a file gone between the
#            sync's listing and its read aborted that sync - every file after
#            it stayed off the bucket while the manifest went up naming them.
#            0.2.1 since GPU-217: with temporary credentials a store could be
#            saved to R2 and never listed, so never restored - R2 refuses
#            the session token in a listing's query.
moonclip = ["moonclip>=0.2.1"]
dev = ["pytest>=7", "numpy"]

[project.urls]
Homepage = "https://github.com/JHNMACHINE/ravex"
Source = "https://github.com/JHNMACHINE/ravex"
Issues = "https://github.com/JHNMACHINE/ravex/issues"
# Shown by PyPI under "Project links", which is where someone deciding whether to
# upgrade looks. A relative link in the README would not serve: PyPI renders
# relative paths as-is instead of resolving them against the repository.
Changelog = "https://github.com/JHNMACHINE/ravex/blob/main/CHANGELOG.md"

[project.scripts]
ravex = "ravex._cli:main"

[tool.hatch.version]
path = "ravex/__init__.py"

# What `ravex/` holds ships, and nothing else: `tests`, `bench` and
# `integration` are outside it. Bytecode is excluded because a wheel built from
# a tree where the tests had already run once shipped a `__pycache__/` of
# `.pyc` files (Moonclip 0.0.4), and a leftover compiled `_core` from a build
# before GPU-267 must not ride along either.
[tool.hatch.build.targets.wheel]
packages = ["ravex"]
exclude = ["**/__pycache__", "**/*.py[cod]", "ravex/_core*"]

# CHANGELOG.md is in the sdist: the source archive is what a distribution
# packager or an auditor reads, and it was the one place the release notes
# were missing.
[tool.hatch.build.targets.sdist]
include = ["/ravex", "/README.md", "/CHANGELOG.md", "/LICENSE", "/NOTICE", "/pyproject.toml"]
exclude = ["**/__pycache__", "**/*.py[cod]", "ravex/_core*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# `tests/unit` and `tests/distributed` (GPU-256): see their conftest.py.
markers = [
    "distributed: several nodes or ranks, as processes or over sockets; the verdict comes from Linux",
    "own_interpreter: a unit test that starts a fresh Python to check what an import pulls in",
]
filterwarnings = ["ignore::DeprecationWarning"]
