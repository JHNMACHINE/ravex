[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ravex"
# Read from ravex/__init__.py; see [tool.setuptools.dynamic] below.
dynamic = ["version"]
description = "Transparent checkpoint and resume for PyTorch training, with no changes to your training code"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [{ name = "JHNMACHINE" }]
keywords = ["pytorch", "checkpoint", "training", "resume", "mlops", "preemption"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# torch is deliberately not a dependency: Ravex attaches to whatever build
# of torch the user already has (CUDA, ROCm, CPU) and must never pull a
# different one in.
dependencies = ["PyYAML>=5.1"]

[project.optional-dependencies]
# 0.0.4, not 0.0.3: that is where `keep_last` stopped erasing the whole
# checkpoint history instead of trimming it, and a checkpointing library that
# loses checkpoints is not a floor worth allowing. (The old `>=0.2` was not
# satisfiable by any version that has ever existed.)
moonclip = ["moonclip>=0.0.4"]
dev = ["pytest>=7", "numpy"]

[project.urls]
Homepage = "https://codeberg.org/JHNMACHINE/ravex"
Source = "https://codeberg.org/JHNMACHINE/ravex"
Issues = "https://codeberg.org/JHNMACHINE/ravex/issues"
# Shown by PyPI under "Project links", which is where someone deciding whether to
# upgrade looks. A relative link in the README would not serve: PyPI renders
# relative paths as-is instead of resolving them against the repository.
Changelog = "https://codeberg.org/JHNMACHINE/ravex/src/branch/main/CHANGELOG.md"

[project.scripts]
ravex = "ravex._cli:main"

[tool.setuptools]
packages = ["ravex"]

[tool.setuptools.dynamic]
version = { attr = "ravex.__version__" }

[tool.setuptools.package-data]
ravex = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
