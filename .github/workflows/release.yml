name: Release

on:
  push:
    tags:
      - 'v*'
  # A manual run is a rehearsal: it builds and checks the artifacts and stops
  # before the upload. A workflow that only triggers on tags can otherwise only
  # be tested by spending a version number. Publishing still requires a tag.
  workflow_dispatch:
  # How a push to the deploy branch publishes (deploy.yml): it makes the tag
  # and calls this with it, since a tag pushed with the job token would start
  # no workflow. The caller's event is that push, so everything below that
  # publishes on a push publishes here too.
  workflow_call:
    inputs:
      tag:
        type: string
        required: true

# The job token only reads: nothing here pushes, tags or comments, and releases
# go out with their own PyPI token.
permissions:
  contents: read

# The tag being released: the one pushed, or the one deploy.yml made. On a
# manual rehearsal, the branch it runs on.
env:
  TAG: ${{ inputs.tag || github.ref_name }}

# One job and one wheel again, since GPU-267. From GPU-105 to 0.7.8 the reshard
# planner and the store transport were a compiled extension, so a wheel was
# specific to an interpreter and a platform and a release was an sdist plus a
# wheel per CPython, built in the manylinux image with a Rust toolchain. Ravex
# is Python only now: one `py3-none-any` wheel serves every interpreter and
# platform, free-threaded 3.14 included, and the sdist builds anywhere.
jobs:
  publish:
    runs-on: ubuntu-latest
    container:
      image: python:3.12-bookworm
    steps:
      # Full history on purpose: the check below has to prove the tagged commit
      # is on main, and a shallow clone cannot answer that question.
      # By sha rather than by ref name, so a manual rehearsal - where the ref is
      # a branch and not a tag - checks out the same way a release does.
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          # The tag when deploy.yml calls; otherwise what triggered the run.
          ref: ${{ inputs.tag || github.ref }}

      # A tag can be pushed from any commit in the repository, including one on
      # a branch that was never reviewed or merged. Publishing is the one action
      # here that cannot be undone - PyPI refuses to reuse a version number - so
      # the tag has to name a commit that reached main.
      - name: Tag must be on main
        if: ${{ github.event_name == 'push' }}
        run: |
          set -eu
          # actions/checkout trusts the workspace only for its own git calls.
          # This container runs as root over a tree the runner user owns, so
          # every git command here stops at "dubious ownership" - and with
          # `git rev-parse` empty, the message below blamed the tag instead.
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "Tag $TAG points at $(git rev-parse --short HEAD)," >&2
            echo "which is not reachable from main. Merge the branch first, then" >&2
            echo "tag the merge commit. Nothing has been published." >&2
            exit 1
          fi
          echo "$(git rev-parse --short HEAD) is on main"

      # One number: the wheel's metadata reads it from `ravex/__init__.py`
      # (hatchling's `[tool.hatch.version]`), which is also what `ravex
      # --version` prints. Ahead of the build and of the token check, because
      # both cost nothing and the mistake this catches is permanent.
      - name: Tag must match the package version
        if: ${{ github.event_name == 'push' }}
        run: |
          set -eu
          VERSION=$(grep -m1 '^__version__ = ' ravex/__init__.py | cut -d'"' -f2)
          echo "ravex/__init__.py $VERSION, tag $TAG"
          if [ "v$VERSION" != "$TAG" ]; then
            echo "Tag $TAG does not match version $VERSION" >&2
            exit 1
          fi

      - name: The publish token must be present
        env:
          PYPI_TOKEN: ${{ secrets.RAVEX_PYPI_TOKEN }}
        run: |
          set -eu
          if [ -z "${PYPI_TOKEN:-}" ]; then
            echo "RAVEX_PYPI_TOKEN is not set: a tag was pushed but nothing" >&2
            echo "would reach PyPI. Add the secret on the repository, delete the" >&2
            echo "tag and push it again." >&2
            exit 1
          fi
          echo "token present"

      - name: Build the sdist and the wheel
        run: |
          set -eu
          pip install --quiet build twine
          python -m build --outdir dist
          ls -la dist/
          twine check dist/*
          # One pure wheel, and the version in its name is the package's.
          VERSION=$(grep -m1 '^__version__ = ' ravex/__init__.py | cut -d'"' -f2)
          ls dist/ravex-"$VERSION"-py3-none-any.whl
          # No compiled file may ride along: a leftover `_core` from an old
          # editable build would install and then shadow nothing, or worse.
          python -c 'import sys, zipfile; names = zipfile.ZipFile(sys.argv[1]).namelist(); bad = [n for n in names if n.endswith((".so", ".pyd", ".pyc"))]; assert not bad, bad; assert "ravex/__init__.py" in names; print("wheel layout ok")' dist/*.whl
          # The sdist has to build without the working tree around it, which
          # is the whole point of shipping one.
          tmp=$(mktemp -d)
          tar xzf dist/*.tar.gz -C "$tmp"
          ls "$tmp"/*/pyproject.toml "$tmp"/*/CHANGELOG.md
          pip wheel --quiet --no-deps --wheel-dir "$tmp/out" "$tmp"/*/
          ls "$tmp"/out/*.whl

      - name: Upload to PyPI
        if: ${{ github.event_name == 'push' }}
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.RAVEX_PYPI_TOKEN }}
        run: |
          set -eu
          # `--skip-existing` so a re-run is harmless. Without it, uploading a
          # file PyPI already holds is a 400 whose body twine reports as just
          # "Bad Request" - which is how this pipeline's first run ever ended,
          # having raced a manual upload of the same 0.0.2 by forty seconds.
          #
          # `ravex[moonclip]` resolves its extra from PyPI, so Moonclip has to
          # be published there before this repository is tagged.
          twine upload --skip-existing dist/*
