name: CI

# Only `main`. Between the six-interpreter matrix, the job that builds Moonclip
# from source and the integration suite, a pull request and its merge ran the
# whole thing twice for one change. `checks.yml` covers the branch cheaply
# instead.
#
# The cost, stated plainly: a branch is not proven against every interpreter
# before merging, so a single-interpreter or integration-only failure lands
# on main.
on:
  push:
    branches: [main]
  # Run it by hand, without inventing a commit to trigger it. The need showed up
  # the first time this repository had Actions switched on after the pushes had
  # already happened: main was untested and there was no event left to replay.
  workflow_dispatch:

jobs:
  # The engine on every interpreter we claim to support. No Moonclip here:
  # `tests/test_backends.py` skips the Moonclip cases when it is absent, so
  # this job covers the runtime, the patches, the sampler and the torch_save
  # backend across the whole matrix.
  #
  # It no longer avoids a Rust build, though, which is what the line above used
  # to say. Since GPU-105 the reshard planner *is* Rust and there is no Python
  # fallback behind it, so every job in this file compiles the crate — four
  # times here, one interpreter each. That is the standing cost of the decision
  # taken in that issue, and it is paid on main rather than on a branch.
  unit:
    runs-on: codeberg-medium
    strategy:
      fail-fast: false
      matrix:
        # Keep in step with the classifiers in pyproject.toml and with
        # https://devguide.python.org/versions/ — this list is that list,
        # not a judgement of our own about who is still out there.
        #
        # 3.15 was here for one day, as a release candidate marked
        # `continue-on-error`, on the theory that a prerelease is worth
        # watching early and never worth holding a tag for. The theory did
        # not survive contact: torch on 3.15.0rc1 **segfaults**, in its own
        # C++ (`TensorImpl::incref_pyobject`, reached through `torch.save`),
        # and it takes the whole pytest process down on the *first* test.
        #
        # So the job produced no partial signal to watch — not "244 pass and
        # one fails", but 246 collected and nothing run. All it left was a
        # permanently red square, which is exactly the thing a real red hides
        # behind on the day someone checks this matrix before tagging.
        #
        # It comes back when torch ships a build that survives 3.15, which is
        # torch's problem and not ours to work around. 3.15 is due final in
        # October 2026; check then.
        python: ["3.11", "3.12", "3.13", "3.14"]
    container:
      image: python:${{ matrix.python }}-bookworm
    steps:
      - name: Install git and Rust
        run: |
          apt-get update -qq
          apt-get install -y -qq git build-essential
          # Since GPU-105 the engine has a Rust core, so `pip install -e .`
          # compiles one. Debian bookworm ships rustc 1.63 and
          # `rust-toolchain.toml` asks for 1.97.1; pinning the same version
          # here means rustup installs one compiler instead of two.
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain 1.97.1 --profile minimal

      # Not shallow, and the checkout is allowed to fail the job. `--depth 1`
      # fetches only the default branch's tip, so a pull request's own commit is
      # not in the clone: the checkout died with "unable to read tree", `|| true`
      # swallowed it, and the job tested main instead. Every PR check was a
      # green tick for code nobody had built.
      - name: Checkout
        run: |
          set -eu
          git clone ${{ forgejo.server_url }}/${{ forgejo.repository }}.git .
          git checkout ${{ forgejo.sha }}

      - name: Test on Python ${{ matrix.python }}
        run: |
          set -eu
          # rustup installs into ~/.cargo/bin, which a fresh shell does not
          # have on PATH — and the failure without this line is maturin
          # reporting that cargo is missing on a job that just installed it.
          . "$HOME/.cargo/env"
          python --version
          # CPU wheels: these tests are about correctness, not throughput, and
          # the CUDA build is gigabytes of download for nothing.
          # `--index-url` *replaces* PyPI rather than adding to it, so pip could
          # not find the build backends torch's own dependencies need
          # (flit_core) and every job died in six seconds. `--extra-index-url`
          # puts PyPI back alongside it. The CPU build still wins: `+cpu` is a
          # PEP 440 local version and sorts above the plain one on PyPI.
          pip install --quiet --index-url https://download.pytorch.org/whl/cpu --extra-index-url https://pypi.org/simple torch
          pip install --quiet -e . pytest
          pytest tests -v

  # Moonclip is Ravex's *default* backend, so leaving it to the skip-if-absent
  # path would mean the shipped configuration is the one nothing runs.
  #
  # Built from git rather than installed from an index on purpose: it makes
  # this job independent of whether a Moonclip release happens to be published,
  # and it tests the pairing at the commit both repositories are actually at.
  moonclip-backend:
    runs-on: codeberg-medium
    container:
      image: python:3.12-bookworm
    steps:
      - name: Install git and Rust
        run: |
          apt-get update -qq
          apt-get install -y -qq git build-essential
          # Debian bookworm ships rustc 1.63. Both repositories now pin
          # 1.97.1 in a `rust-toolchain.toml`, and rustup honours those
          # over whatever is installed here — so naming the same version
          # is the difference between one compiler and three.
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain 1.97.1 --profile minimal

      # Not shallow, and the checkout is allowed to fail the job. `--depth 1`
      # fetches only the default branch's tip, so a pull request's own commit is
      # not in the clone: the checkout died with "unable to read tree", `|| true`
      # swallowed it, and the job tested main instead. Every PR check was a
      # green tick for code nobody had built.
      - name: Checkout
        run: |
          set -eu
          git clone ${{ forgejo.server_url }}/${{ forgejo.repository }}.git .
          git checkout ${{ forgejo.sha }}

      - name: Build Moonclip and run the full suite
        run: |
          . "$HOME/.cargo/env"
          pip install --quiet --index-url https://download.pytorch.org/whl/cpu --extra-index-url https://pypi.org/simple torch
          pip install --quiet maturin pytest pytest-xdist
          git clone --depth 1 \
            ${{ forgejo.server_url }}/${{ forgejo.repository_owner }}/moonclip.git /tmp/moonclip
          pip install --quiet /tmp/moonclip
          pip install --quiet -e .
          python -c "import moonclip; print('moonclip', moonclip.__version__)"
          # With Moonclip present the backend tests stop skipping: this is
          # the only job where the default write path is exercised at all -
          # and not only the tests that name Moonclip. `get_backend` falls
          # back to `torch.save` when it is absent, so with it installed the
          # *whole* suite writes by a different road. That is why this job
          # runs all of it rather than a selection of it.
          #
          # **On four workers, because it had run out of room.** This job
          # went red on every push from 6bc008c - the commit that added
          # `test_outer_rendezvous.py` - and at the ten-minute wall on most of
          # them: two of those eight were a push two minutes later cancelling
          # the run instead, which reads the same from the API and is not the
          # same thing. `da7de2c`, the last of them, was killed at 10m02s. The
          # last green before all this, 7dab99a, finished at 9m37s: twenty-
          # three seconds of room, and the new file costs seventy.
          # The suite is the cost and not the build: in a container with this
          # runner's shape, building Moonclip takes 59 s and the whole setup
          # 167.
          #
          # Two tests are half of what is left, and both of them mostly wait -
          # for a node that died not to come back, and for enough steps to
          # prove that a round will never close. They are in different files,
          # so on separate workers their waits overlap instead of adding up:
          # 258 s becomes 96 s, with the same 1017 passed and 45 skipped.
          #
          # `--dist loadfile`, not the default: these tests are isolated at
          # the file - a store, a port, a working directory belong to the file
          # that sets them up - so a file kept on one worker behaves as it
          # does serially. `-n 4` is spelled out rather than `auto` because
          # the label says four cores while a count read from the host would
          # be larger. `OMP_NUM_THREADS=1` because four workers each taking
          # four threads is how a parallel suite ends up slower than a serial
          # one.
          OMP_NUM_THREADS=1 pytest tests -v -n 4 --dist loadfile

  # What the unit suite structurally cannot reach: config discovery from the
  # working directory, a resume that starts from a genuinely empty interpreter,
  # torchrun, and a crash delivered as SIGKILL — where no `finally` and no
  # atexit hook runs, which is the one thing the decorator cannot promise.
  # Mirrors integration/Dockerfile — keep the two in step.
  integration:
    runs-on: codeberg-medium
    container:
      image: python:3.12-bookworm
    steps:
      - name: Install git and Rust
        run: |
          apt-get update -qq
          apt-get install -y -qq git build-essential
          # Since GPU-105 the engine has a Rust core, so `pip install -e .`
          # compiles one. Debian bookworm ships rustc 1.63 and
          # `rust-toolchain.toml` asks for 1.97.1; pinning the same version
          # here means rustup installs one compiler instead of two.
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain 1.97.1 --profile minimal

      # Not shallow, and the checkout is allowed to fail the job. `--depth 1`
      # fetches only the default branch's tip, so a pull request's own commit is
      # not in the clone: the checkout died with "unable to read tree", `|| true`
      # swallowed it, and the job tested main instead. Every PR check was a
      # green tick for code nobody had built.
      - name: Checkout
        run: |
          set -eu
          git clone ${{ forgejo.server_url }}/${{ forgejo.repository }}.git .
          git checkout ${{ forgejo.sha }}

      - name: Install
        run: |
          set -eu
          . "$HOME/.cargo/env"
          pip install --quiet --index-url https://download.pytorch.org/whl/cpu --extra-index-url https://pypi.org/simple torch
          pip install --quiet pytest numpy
          pip install --quiet -e .

      - name: Check the install
        # Not "arm the autoloader" any more — there is nothing to arm since
        # GPU-108. `status` still earns the step: it fails here if the compiled
        # core did not build, instead of inside the first test that resumes.
        run: ravex status

      - name: Integration suite
        # `integration/` and `tests/` both have a conftest.py, and pytest
        # collides on the module name if they are collected together. They are
        # separate jobs here, so this only has to name one of them.
        #
        # test_frameworks.py is excluded because it is the only file that needs
        # transformers, accelerate and lightning — it has its own job below.
        run: pytest integration -v --tb=short --ignore=integration/test_frameworks.py

  # Split out of `integration` because that job hit the ten-minute wall on
  # `codeberg-medium` — 602 seconds, the limit to the second — and was cancelled
  # on every run.
  #
  # The split works because it *removes* cost rather than dividing it:
  # transformers, accelerate and lightning are hundreds of megabytes, and
  # `test_frameworks.py` is the only file in the suite that imports them. The
  # job above no longer pays for them at all, and this one runs a single file.
  integration-frameworks:
    runs-on: codeberg-medium
    container:
      image: python:3.12-bookworm
    steps:
      - name: Install git and Rust
        run: |
          apt-get update -qq
          apt-get install -y -qq git build-essential
          # Since GPU-105 the engine has a Rust core, so `pip install -e .`
          # compiles one. Debian bookworm ships rustc 1.63 and
          # `rust-toolchain.toml` asks for 1.97.1; pinning the same version
          # here means rustup installs one compiler instead of two.
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain 1.97.1 --profile minimal

      - name: Checkout
        run: |
          set -eu
          git clone ${{ forgejo.server_url }}/${{ forgejo.repository }}.git .
          git checkout ${{ forgejo.sha }}

      - name: Install
        run: |
          set -eu
          . "$HOME/.cargo/env"
          pip install --quiet --index-url https://download.pytorch.org/whl/cpu --extra-index-url https://pypi.org/simple torch
          pip install --quiet pytest numpy
          # The frameworks Ravex claims to support by hooking PyTorch itself.
          # Both own the training loop and wrap the dataloader in ways plain
          # PyTorch does not, so the claim is an argument until this runs.
          pip install --quiet "transformers>=4.40" "accelerate>=1.1" "lightning>=2.2"
          pip install --quiet -e .

      - name: Check the install
        run: ravex status

      - name: Framework integration suite
        run: pytest integration/test_frameworks.py -v --tb=short
