name: Release

on:
  push:
    tags:
      - 'v*'
  # A manual run is a rehearsal: it builds and checks the artifacts and stops
  # before the upload. A workflow that only triggers on tags can otherwise only
  # be tested by spending a version number. Publishing still requires a tag.
  workflow_dispatch:

jobs:
  build-and-publish:
    runs-on: codeberg-small
    container:
      # Plain Python, unlike Moonclip's release: Ravex is pure Python and has
      # no extension to compile, so one `py3-none-any` wheel serves every
      # interpreter and platform. No manylinux image, no per-version matrix.
      image: python:3.12-bookworm
    steps:
      - name: Install git
        run: |
          apt-get update -qq
          apt-get install -y -qq git

      # Full history on purpose: the check below has to prove the tagged commit
      # is on main, and a shallow clone cannot answer that question.
      # By sha rather than by ref name, so a manual rehearsal — where the ref is
      # a branch and not a tag — checks out the same way a release does.
      - name: Checkout
        run: |
          git clone ${{ forgejo.server_url }}/${{ forgejo.repository }}.git .
          git checkout ${{ forgejo.sha }}

      # A tag can be pushed from any commit in the repository, including one on
      # a branch that was never reviewed or merged. Publishing is the one action
      # here that cannot be undone — PyPI refuses to reuse a version number — so
      # the tag has to name a commit that reached main.
      - name: Tag must be on main
        if: ${{ forgejo.event_name == 'push' }}
        run: |
          set -eu
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "Tag ${{ forgejo.ref_name }} points at $(git rev-parse --short HEAD)," >&2
            echo "which is not reachable from main. Merge the branch first, then" >&2
            echo "tag the merge commit. Nothing has been published." >&2
            exit 1
          fi
          echo "$(git rev-parse --short HEAD) is on main"

      # The tag is what a user installs; the metadata is what pip believes.
      # They are written in one place (`ravex/__init__.py`, read by
      # `[tool.setuptools.dynamic]`), and this makes sure the tag agrees with
      # it — a mismatch here means publishing a version nobody asked for.
      #
      # Ahead of the build, and of the token check below, because both cost
      # nothing and the mistake they catch cannot be undone.
      - name: Tag must match the package version
        if: ${{ forgejo.event_name == 'push' }}
        run: |
          set -eu
          VERSION=$(python -c "import ravex; print(ravex.__version__)")
          TAG="${{ forgejo.ref_name }}"
          echo "package $VERSION, tag $TAG"
          if [ "v$VERSION" != "$TAG" ]; then
            echo "Tag $TAG does not match ravex.__version__ ($VERSION)" >&2
            exit 1
          fi

      - name: The publish token must be present
        env:
          PYPI_TOKEN: ${{ secrets.RAVEX_PYPI_TOKEN }}
        run: |
          set -eu
          if [ -z "${PYPI_TOKEN:-}" ]; then
            echo "RAVEX_PYPI_TOKEN is not set: a tag was pushed but nothing" >&2
            echo "would reach PyPI. Add the secret on the repository, delete the" >&2
            echo "tag and push it again." >&2
            exit 1
          fi
          echo "token present"

      - name: Build sdist and wheel
        run: |
          set -eu
          pip install --quiet build twine
          python -m build
          echo "=== Built ==="
          ls -la dist/

      - name: Check the artifacts before uploading
        run: twine check dist/*

      # PyPI only. Codeberg Packages used to get a copy of the same artifacts,
      # which bought nothing: identical bytes at an address almost nobody would
      # point pip at, and a second token to keep alive. Note that
      # `ravex[moonclip]` resolves its extra from PyPI, so Moonclip has to be
      # published there before this repository is tagged.
      - name: Publish to PyPI
        if: ${{ forgejo.event_name == 'push' }}
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.RAVEX_PYPI_TOKEN }}
        run: |
          set -eu
          twine upload dist/*
